[package]
name = "metwo"
version = "0.1.0"
description = "metwo desktop shell: runs the daemon, tray, board"
edition = "2021"

[lib]
name = "metwo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-notification = "2"
